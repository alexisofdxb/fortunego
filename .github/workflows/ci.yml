name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @plotgo/api db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Balance regression
        run: pnpm test:balance

      - name: Performance simulation
        run: pnpm simulate:performance

      - name: Build web
        run: pnpm --filter @plotgo/web build

      # Onboarding acceptance needs a live API + Postgres; runs once integration
      # tests move to a service container. See docs/AUDIT.md and roadmap in README.
