services:
  db:
    image: postgres:16-alpine
    container_name: plotgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: plotgo
      POSTGRES_PASSWORD: plotgo
      POSTGRES_DB: plotgo
    ports:
      - "5434:5432"
    volumes:
      - plotgo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plotgo -d plotgo"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: plotgo-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  plotgo_pgdata:
