<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlotGo — World Prototype</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b120c; }
      #world { position: fixed; inset: 0; }
      #world-hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        padding: 10px 14px; border-radius: 10px;
        font: 12px/1.5 "IBM Plex Sans", system-ui, sans-serif; color: #e8dfc8;
        background: rgba(14, 20, 16, 0.78); border: 1px solid #2c3d5c;
        backdrop-filter: blur(6px); user-select: none;
      }
      #world-hud b { color: #d4a017; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
      #world-hud a { color: #d4a017; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="world-hud">
      <b>World prototype</b><br />
      Left/right-drag or WASD/arrows: pan · Shift+right-drag or Q/E: rotate · Wheel: zoom at cursor<br />
      <a href="/">← back to the game</a>
    </div>
    <script type="module" src="/src/world/main.ts"></script>
  </body>
</html>
